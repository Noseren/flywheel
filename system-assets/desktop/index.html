<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flywheel</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f4f0; color: #252521; }
    main { width: min(520px, calc(100vw - 64px)); padding: 40px; border: 1px solid #d9d7cf; border-radius: 20px; background: #fff; box-shadow: 0 18px 60px rgba(30, 29, 25, .08); }
    small { display: block; margin-bottom: 14px; color: #77746c; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 30px; font-weight: 620; }
    p { margin: 0; color: #66635c; line-height: 1.7; }
    .bar { height: 3px; margin-top: 28px; overflow: hidden; border-radius: 3px; background: #e7e5de; }
    .bar::after { content: ""; display: block; width: 42%; height: 100%; background: #4c6b55; animation: loading 1.2s ease-in-out infinite alternate; }
    @keyframes loading { to { transform: translateX(138%); } }
    @media (prefers-color-scheme: dark) {
      body { background: #171815; color: #eeeee8; }
      main { background: #20211e; border-color: #383a34; box-shadow: none; }
      p, small { color: #aaa99f; } .bar { background: #34362f; } .bar::after { background: #8fb298; }
    }
  </style>
</head>
<body>
  <main>
    <small>Flywheel Desktop</small>
    <h1>正在启动工作台</h1>
    <p>正在连接本地 Runtime。首次启动可能需要几秒钟。</p>
    <div class="bar" aria-label="正在启动"></div>
  </main>
</body>
</html>
